name: Rate Joke
run-name: Rate Joke by ${{ github.event.comment.user.login }}

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  joke:
    name: Rate Joke
    runs-on: ubuntu-latest
    # This opts the entire job into the Node 24 runner behavior early
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

    steps:
      - uses: actions/checkout@v6 # ⬅️ Bumped from v4 to v6

      - name: Rate Joke
        id: rate-joke
        uses: ./
        with:
          joke: ${{ github.event.comment.body }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update comment
        if: fromJSON(steps.rate-joke.outputs.result).is_joke == true
        uses: peter-evans/create-or-update-comment@v5
        env:
          JOKE_RESULT: ${{ steps.rate-joke.outputs.result }}
        with:
          comment-id: ${{ github.event.comment.id }}
          reactions: laugh
          edit-mode: replace
          body: |
            ## 🤖 AI Joke Rating Results

            **Your joke:**
            > ${{ github.event.comment.body }}

            **AI Analysis:**
            - **Score:** ${{ fromJSON(env.JOKE_RESULT).score }}/10
            - **Humor Type:** ${{ fromJSON(env.JOKE_RESULT).humor_type }}
            - **Feedback:** ${{ fromJSON(env.JOKE_RESULT).feedback }}